# Copy to config.yaml on each computer, then fill ONLY cvv:
#   cp config.example.yaml config.yaml
# This file is what GitHub has. config.yaml stays on the machine (gitignored).

dry_run: true   # keep true. Script never clicks Đặt hàng.

# =============================================================================
# PHONE PICKER — on launch night you change ONE line: mode
# =============================================================================
#
#   mode: test    → iPhone 18 Pro Max (practice, live now)
#   mode: launch  → iPhone Duo (pre-order 16 Oct 2026, 19:00 VN)
#
# Only four things decide which phone lands in the bag:
#
#   year      The guard. Any page that is not this generation is refused before
#             anything is added. Wrong year = the run stops, safely. It is the
#             word that must appear in "iPhone ___", so for a phone with no
#             number use the family word: iPhone Air is year: air, model: air.
#   model     Which size tile to click, and which guard to run. Valid values:
#               pro-max   the larger Pro. Also verifies 6.9" really got picked.
#               pro       the smaller Pro (never matches Pro Max)
#               plus      the larger non-Pro
#               base      the plain one (not Plus/Pro/Max)
#               air       single-size families
#               duo       iPhone Duo (foldable). year: duo, model: duo.
#   colors    The one that breaks on launch night, because Apple renames
#             colours every generation. Write the ENGLISH name: the page shows
#             Vietnamese, but the DOM handle stays English and both are
#             searched, so "cosmicorange" works as well as "Cam Vũ Trụ".
#   storages  Same idea, but safe: "256" matches "256GB".
#
# You do NOT need screensizes — it is derived from model. You do NOT need
# family_match — it is derived from year + model. Leave both out.
#
# If a colour does not match, the script beeps and waits for you to click it in
# Chrome (on_miss: wait_user), then carries on. It never silently buys another
# colour, because allow_failover is false.
# =============================================================================

mode: test

# Full practice run on the live iPhone 18 Pro Max page.
# Colours are tried in order; the first one PRESENT on the page wins.
test:
  target:
    year: 18
    model: pro-max
  label: "TEST iPhone 18 Pro Max 256GB Burgundy"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro"
  family_urls:
    - "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro-max"
  product_prefs:
    colors:
      - "burgundy"          # page reads 'Đỏ Burgundy'
      - 're:burgundy|đỏ'
    storages: ["256GB", "256"]
    on_miss: wait_user
    user_pick_timeout_sec: 20
    allow_failover: false

# iPhone Duo — VN pre-order Friday 16 Oct 2026, 19:00.
# Live VN shop 12 Sept: family URL below, two colours, 256GB–2TB.
# DOM handles: dimensionColor_nightsky / dimensionColor_starwhite.
launch:
  target:
    year: duo
    model: duo
  label: "iPhone Duo 256GB Night Sky"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-duo"
  product_prefs:
    colors:
      - "nightsky"          # page reads 'Trời Đêm'
      - 're:night.?sky|trời'
      # Swap to star white:
      # - "starwhite"       # page reads 'Trắng Ánh Sao'
      # - 're:star.?white|ánh\s*sao'
    storages: ["256GB", "256"]
    on_miss: wait_user
    user_pick_timeout_sec: 30
    allow_failover: false


# =============================================================================
# SHARED — same for TEST and LAUNCH
# =============================================================================
family_hub_url: "https://www.apple.com/vn/shop/buy-iphone/"
family_user_pick_timeout_sec: 45
unlock_timeout_sec: 12
# Family URL is correct but Apple shows a logo / locked configure.
# Keep refreshing that URL (does not go to the hub) for this many seconds.
locked_refresh_timeout_sec: 1800

# SSO fuel only — MUST stay a LIVE iPhone 17 link even on launch night.
