#       - 're:cosmic|orange|cam\s*vũ'
#     storages: ["256GB", "256"]
#     on_miss: wait_user
#     user_pick_timeout_sec: 20
#     allow_failover: false

# iPhone Duo (foldable) is NOT the order target — VN pre-order 16 Oct.
launch:
  target:
    year: 18
    model: pro-max
  label: "iPhone 18 Pro Max 256GB Burgundy"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro"
  family_urls:
    - "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro-max"
  product_prefs:
    # Live VN page 10 Sept: dimensionColorburgundy='Đỏ Burgundy',
    # glacier='Băng Thanh', silver='Bạc', black='Đen'.
    #colors:
    #  - "glacier"
    #  - 're:glacier|băng'
    colors:
      - "burgundy"
      - 're:burgundy|đỏ'
    storages: ["256GB", "256"]
    on_miss: wait_user
    user_pick_timeout_sec: 30
    allow_failover: false


# =============================================================================
