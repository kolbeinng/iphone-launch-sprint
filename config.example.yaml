# Copy to config.yaml and edit:
#   cp config.example.yaml config.yaml
#
# PRACTICE vs LAUNCH (iPhone 18): see comments in config.yaml.
# Launch night flip is mainly: family_match: ["18", "Pro"]
# Keep dry_run: true, keep warm_product_url on a LIVE iPhone 17 SKU.

dry_run: true

label: "iPhone 17 256GB Đen (practice) — swap label at launch"

# =============================================================================
# FAMILY URL — timed run polls until configure unlocks
# =============================================================================
# Guessed family URL(s) — soft-404 ("Không Tìm Thấy Trang") is skipped quickly
family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17-pro"
# family_urls:
#   - "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro"
#   - "https://www.apple.com/vn/shop/buy-iphone/iphone-18"
family_hub_url: "https://www.apple.com/vn/shop/buy-iphone/"
# Hub auto-pick: card text/href must contain ALL tokens. Else you click the tile.
family_match: ["17", "Pro"]
family_user_pick_timeout_sec: 45
# Phase A budget only (seconds). Then hub scrape → optional user click.
unlock_timeout_sec: 20

product_prefs:
  # Pro pages only: 6.3 = Pro, 6.9 = Pro Max (rumor: same for 18)
  screensizes: ["6,3", "6.3", "6_3inch", "6_3"]
  # colors: substring OR regex (re:cam|orange  /  /cam.*trụ/i)
  # No match → wait_user (you click in Chrome; continues ~50ms) | stop | failover
  colors: ["Đen", "black"]
  storages: ["256GB", "256gb", "256"]
  on_miss: wait_user
  user_pick_timeout_sec: 20
  allow_failover: false

# WORKING warm deep link (iPhone 17 6.3" 256GB Đen) — keep for --warm-only SSO
warm_product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"
product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"

warm_url: "https://www.apple.com/vn/shop/goto/account"
session_url: "https://www.apple.com/vn/shop/goto/account"

launch_at: "2026-09-19T19:00:00"
timezone: "Asia/Ho_Chi_Minh"
warm_minutes_before: 10
browser: "Google Chrome"

manual_clicks:
  no_trade_in: "Không đổi cũ lấy mới"
  no_applecare: "Không có bảo hành AppleCare+"

checkout:
  location_city: "Thành phố Hồ Chí Minh"
  location_district: "Quận Bình Thạnh"
  # false = select matching saved shipping address (visible name + street).
  # Falls back to Sử dụng địa chỉ mới if none match. true = always fill new.
  use_new_address: false
  # Per-card / per-machine. Name, street, email, phone, product can be copied; CVV cannot.
  cvv: ""
  # OFF: fix card billing in Apple Account before running (recommended).
  # ON + billing_address below = slow ~40s Chỉnh Sửa Địa Chỉ popup safety net.
  sync_billing_address: false
  force_sync_billing_address: false
  # Delivery destination
  shipping_address:
    first_name: "Your"
    last_name: "Name"
    street: "Street address"
    street2: ""
    state: "Thành phố Hồ Chí Minh"
    city: "Quận Bình Thạnh"
    district: "Phường 11"
    postal_code: ""
  # Optional card-billing override (keep commented unless sync_billing_address: true)
  # billing_address:
  #   first_name: "Your"
  #   last_name: "Name"
  #   street: "Street address"
  #   street2: ""
  #   state: "Thành phố Hồ Chí Minh"
  #   city: "Quận 7"
  #   district: "Phường Tân Hưng"
  #   postal_code: ""
  contact:
    email: "you@example.com"
    phone: "0900000000"

watcher:
  enabled: true
  poll_seconds: 20
  window_minutes_before: 15
  window_minutes_after: 30
