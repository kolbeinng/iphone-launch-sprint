# Copy to config.yaml on each computer, then fill ONLY cvv:
#   cp config.example.yaml config.yaml
# This file is what GitHub has. config.yaml stays on the machine (gitignored).

dry_run: true   # keep true. Script never clicks Đặt hàng.

# =============================================================================
# PHONE PICKER — on launch night you change ONE line: mode
# =============================================================================
#
#   mode: test    → iPhone 17 Pro Max (practice, live now)
#   mode: launch  → iPhone 18 Pro Max (launch night)
#
# Only four things decide which phone lands in the bag:
#
#   year      The guard. Any page that is not this generation is refused before
#             anything is added. Wrong year = the run stops, safely.
#   model     Which size tile to click, and which guard to run. Valid values:
#               pro-max   the larger Pro. Also verifies 6.9" really got picked.
#               pro       the smaller Pro (never matches Pro Max)
#               plus      the larger non-Pro
#               base      the plain one (not Plus/Pro/Max)
#               air       single-size families
#   colors    MUST match a real Apple VN name. This is the one that breaks on
#             launch night, because Apple renames colours every generation.
#   storages  Same idea, but safe: "256" matches "256GB".
#
# You do NOT need screensizes — it is derived from model. You do NOT need
# family_match — it is derived from year + model. Leave both out.
#
# If a colour does not match, the script beeps and waits for you to click it in
# Chrome (on_miss: wait_user), then carries on. It never silently buys another
# colour, because allow_failover is false.
# =============================================================================

mode: test

test:
  target:
    year: 17
    model: pro-max
  label: "TEST iPhone 17 Pro Max 256GB Cam Vũ Trụ"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17-pro"
  product_prefs:
    colors:
      - "Cam Vũ Trụ"
      - "cosmicorange"
      - 're:cam|orange|cosmic'
    storages: ["256GB", "256"]
    on_miss: wait_user
    user_pick_timeout_sec: 20
    allow_failover: false

# Fold / Ultra is NOT listed — not the VN order target.
launch:
  target:
    year: 18
    model: pro-max
  label: "iPhone 18 Pro Max 256GB Đỏ Anh Đào"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro"
  family_urls:
    - "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro-max"
  product_prefs:
    # RECHECK AFTER THE SEPT 9 KEYNOTE. Cam Vũ Trụ was iPhone 17 and is not
    # expected to return. Rumoured iPhone 18 Pro: Dark Cherry (new headline),
    # Sky/Light Blue, Dark Gray, Silver. Nothing is official until Apple VN
    # publishes the page, so these are ordered guesses plus a wide regex net.
    # The moment pre-orders open, run probe_family.py — it prints the real
    # names, and you paste the right one in here.
    colors:
      - "Đỏ Anh Đào"        # guess at Apple VN's name for Dark Cherry
      - "darkcherry"        # Apple's slug is usually the English name
      # Last resort. Dark Cherry is the only red in a lineup of blue, gray and
      # silver, so anything red can only be the one we want. This still hits if
      # Apple slugs it darkred/wine or names it Đỏ Thẫm instead of Anh Đào.
      - 're:cherry|anh\s*đào|đào|burgundy|wine|đỏ'
    storages: ["256GB", "256"]
    on_miss: wait_user
    user_pick_timeout_sec: 30
    allow_failover: false


# =============================================================================
# SHARED — same for TEST and LAUNCH
# =============================================================================
family_hub_url: "https://www.apple.com/vn/shop/buy-iphone/"
family_user_pick_timeout_sec: 45
unlock_timeout_sec: 12

# SSO fuel only — MUST stay a LIVE iPhone 17 link even on launch night.
warm_product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"
product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"

warm_url: "https://www.apple.com/vn/shop/goto/account"
session_url: "https://www.apple.com/vn/shop/goto/account"

# CONFIRM THIS AFTER THE SEPT 9 KEYNOTE — it is the one value that makes the
# whole run pointless if it is wrong.
#
# Keynote is Wed 9 Sept 2026. The sprint you care about is PRE-ORDER, not the
# on-sale day: pre-order is when stock and delivery slots actually run out.
# Press reports expect pre-orders on Sat 12 Sept (moved off Fri 11 Sept, the
# 25th anniversary of 9/11), with delivery from Fri 18 Sept, VN in wave one.
#
# 19:00 VN = 05:00 US Pacific, which is Apple's usual pre-order hour. One leak
# says 00:00 Pacific this year instead, which would be 14:00 VN. Unconfirmed.
#
# If unsure, start --at-launch early: it just waits, and the watcher polls.
launch_at: "2026-09-12T19:00:00"
timezone: "Asia/Ho_Chi_Minh"
warm_minutes_before: 10
browser: "Google Chrome"

manual_clicks:
  no_trade_in: "Không đổi cũ lấy mới"
  no_applecare: "Không có bảo hành AppleCare+"

checkout:
  # How many of this iPhone to take to checkout. Bag default is 1.
  # Script sets this on the bag page before Thanh Toán. Apple often caps iPhone at 2.
  quantity: 1
  location_city: "Thành phố Hồ Chí Minh"
  location_district: "Quận Bình Thạnh"
  use_new_address: false
  cvv: ""
  # Safety net, not a cost: with force off, this only fires when Apple actually
  # opens the address editor, and it re-enables the automatic retry if the review
  # step is ever blocked by a billing address error. Normal runs are unaffected.
  sync_billing_address: true
  force_sync_billing_address: false

  shipping_address:
    first_name: "Võ Văn"
    last_name: "Quân"
    street: "354/89/13 phan văn trị phường 11 tphcm"
    street2: ""
    state: "Thành phố Hồ Chí Minh"
    city: "Quận Bình Thạnh"
    district: "Phường 11"
    postal_code: ""

  contact:
    email: "Quanvo1992@gmail.com"
    phone: "0969515515"

watcher:
  enabled: true
  poll_seconds: 20
  window_minutes_before: 15
  window_minutes_after: 30
