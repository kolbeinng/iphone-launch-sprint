# Copy to config.yaml and edit:
#   cp config.example.yaml config.yaml

# HARD RULE: this kit never places an order. dry_run must stay true.
dry_run: true

label: "iPhone 17 256GB Đen (dynamic SKU practice)"

# ---------------------------------------------------------------------------
# DYNAMIC SKU (recommended for launch)
# Timed run opens family_url, polls until configure unlocks, then picks
# screensize (Pro) → color → capacity from product_prefs (ordered fallbacks).
# ---------------------------------------------------------------------------
family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17"
# Optional extras to poll if the primary 404s at T-0:
# family_urls:
#   - "https://www.apple.com/vn/shop/buy-iphone/iphone-17-pro"
unlock_timeout_sec: 180

product_prefs:
  # Pro pages only (ignored on plain iPhone 17 / Air)
  screensizes: ["6,3", "6.3", "6_3"]
  colors: ["Đen", "black"]
  storages: ["256GB", "256gb", "256"]

# Known-live deep link — used for --warm-only SSO fuel + fallback if you
# disable product_prefs. Keep an iPhone 17 configured URL for warm.
warm_product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"
product_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17/m%C3%A0n-h%C3%ACnh-6,3-inch-256gb-%C4%91en"

warm_url: "https://www.apple.com/vn/shop/goto/account"
session_url: "https://www.apple.com/vn/shop/goto/account"

launch_at: "2026-09-19T19:00:00"
timezone: "Asia/Ho_Chi_Minh"
warm_minutes_before: 10

browser: "Google Chrome"

manual_clicks:
  no_trade_in: "Không đổi cũ lấy mới"
  no_applecare: "Không có bảo hành AppleCare+"

checkout:
  location_city: "Thành phố Hồ Chí Minh"
  location_district: "Quận Bình Thạnh"
  use_new_address: true
  address:
    first_name: "Your"
    last_name: "Name"
    street: "Street address"
    street2: ""
    state: "Thành phố Hồ Chí Minh"
    city: "Quận Bình Thạnh"
    district: "Phường 11"
    postal_code: ""
  contact:
    email: "you@example.com"
    phone: "0900000000"

watcher:
  enabled: true
  poll_seconds: 20
  window_minutes_before: 15
  window_minutes_after: 30
