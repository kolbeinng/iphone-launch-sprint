# Copy to config.yaml on each computer, then fill ONLY cvv:
#   cp config.example.yaml config.yaml
# This file is what GitHub has. config.yaml stays on the machine (gitignored).

dry_run: true   # keep true. Script never clicks Đặt hàng.

# =============================================================================
# PHONE PICKER — change ONLY this line on launch night
# =============================================================================
#
#   mode: test    → iPhone 17 Pro Max (practice, live now)
#   mode: launch  → iPhone 18 Pro Max (launch night)
#
# Both blocks stay uncommented. Confirm launch_at when Apple announces VN time.
# =============================================================================

mode: test

test:
  target:
    year: 17
    model: pro-max
  label: "TEST iPhone 17 Pro Max 256GB Cam Vũ Trụ"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-17-pro"
  family_match: ["17", "Pro Max"]
  product_prefs:
    screensizes: ["Pro Max", "6,9", "6.9", "6_9inch", "6_9"]
    colors:
      - "Cam Vũ Trụ"
      - "cosmicorange"
      - "re:cam|orange|cosmic"
    on_miss: wait_user
    user_pick_timeout_sec: 20
    allow_failover: false
    storages: ["256GB", "256gb", "256", "re:256"]

# Fold is NOT listed — not expected on apple.com/vn.
launch:
  target:
    year: 18
    model: pro-max
  label: "iPhone 18 Pro Max 256GB Cam Vũ Trụ"
  family_url: "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro"
  family_urls:
    - "https://www.apple.com/vn/shop/buy-iphone/iphone-18-pro-max"
  family_match: ["18", "Pro Max"]
  product_prefs:
    screensizes: ["Pro Max", "6,9", "6.9", "6_9inch", "6_9"]
    colors:
      - "Cam Vũ Trụ"
      - "cosmicorange"
      - "re:cam|orange|cosmic"
    on_miss: wait_user
    user_pick_timeout_sec: 20
    allow_failover: false
    storages: ["256GB", "256gb", "256", "re:256"]


# =============================================================================
# SHARED — same for TEST and LAUNCH
# =============================================================================
